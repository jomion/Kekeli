<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Mes badges</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">
<link rel="stylesheet" href="../../css/style-public.css">
<link rel="stylesheet" href="../../css/theme-premium-eleve.css">
<style>
  .grille-mes-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 14px; }
  .carte-mon-badge { background: white; border-radius: 12px; padding: 18px 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid var(--bleu-kekeli); }
  .carte-mon-badge .icone-mon-badge { font-size: 40px; }
  .carte-mon-badge h4 { margin: 8px 0 2px; font-size: 13px; color: var(--noir-kekeli); }
  .carte-mon-badge p { margin: 0; font-size: 11px; color: var(--text-gris); }
  .carte-mon-badge .date-mon-badge { margin-top: 6px; font-size: 10px; color: var(--text-gris); font-style: italic; }
  /* Badges de paliers (lot "Activité et Paliers / Badges", 11 septembre 2026) :
     étoiles/logos/médailles/trophées, "toute matière confondue" par défaut,
     avec filtre par palier — voir js/pages/eleve-badges.js. */
  .grille-totaux-badges-paliers { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 10px; }
  .carte-total-badge-palier { background: white; border-radius: 12px; padding: 16px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 26px; }
  .carte-total-badge-palier .valeur-total-badge-palier { font-size: 22px; font-weight: 800; color: var(--bleu-kekeli); margin: 4px 0 2px; }
  .carte-total-badge-palier div:last-child { font-size: 12px; color: var(--text-gris); font-weight: 600; }
  .filtres-palier-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .bouton-filtre-palier-badges { font-size: 13px; padding: 7px 14px; }
  .carte-detail-palier-badges { background: white; border-radius: 10px; border-left: 5px solid var(--bleu-kekeli); padding: 14px 16px; margin-top: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
</style>
<link rel="stylesheet" href="../../css/pied-de-page.css">
</head>
<body>
  <header></header>

  <div class="conteneur-tableau-bord" id="contenu">
    <p style="text-align:center;color:var(--text-gris)">Chargement...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-utilisateur.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/navigation-config.js"></script>
  <script src="../../js/banniere-site.js"></script>
  <script src="../../js/entete-navigation.js"></script>
  <script src="../../js/theme-premium-eleve.js"></script>
  <script src="../../js/pages/eleve-badges.js"></script>
  <footer></footer>
  <script src="../../js/pied-de-page.js"></script>
</body>
</html>
