<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - L'Atelier du Français</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">
<link rel="stylesheet" href="../../css/style-public.css">
<link rel="stylesheet" href="../../css/theme-premium-eleve.css">
<link rel="stylesheet" href="../../css/jeu-atelier-francais.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <header></header>

  <!-- Port quasi-verbatim du nouveau fichier de référence "atelier_français.html"
       fourni par le porteur du projet : même banque de 30 questions (6 catégories
       × 3 difficultés), même sélection catégorie/difficulté, même minuteur, même
       décompte, mêmes sons synthétisés, même bilan (mascotte dansante, confettis,
       tableau d'erreurs). Sur le même principe déjà appliqué au jeu "Cadran
       opératoire" (voir jeu-calcul-mental.html et la leçon retenue n°13 du
       document d'état des lieux) : reproduction fidèle plutôt qu'intégration au
       moteur d'arcade commun (js/jeux/) — ce jeu ne pioche donc plus dans les
       vraies séances publiées, exactement comme le fichier de référence. Tient
       sur un seul écran, sans défilement, avec l'en-tête fixe standard du site. -->
  <div class="atelier-page">
    <div class="atelier-app" id="atelierApp">
      <div class="atelier-countdown-overlay" id="atelierCountdownOverlay">3</div>

      <div class="atelier-header-bar">
        <a href="jeux-educatifs.html" class="atelier-btn-lien-retour" title="Retour aux jeux">⬅️</a>
        <h1>L'Atelier du Français</h1>
        <button type="button" class="atelier-btn-settings" id="atelierBtnSettings">⚙️ Options</button>
      </div>

      <div class="atelier-top-controls">
        <div class="atelier-category-selector">
          <button type="button" class="atelier-cat-btn active" data-cat="all">🌟 Tout</button>
          <button type="button" class="atelier-cat-btn" data-cat="conjugaison">⏳ Conjugaison</button>
          <button type="button" class="atelier-cat-btn" data-cat="grammaire">🧩 Grammaire</button>
          <button type="button" class="atelier-cat-btn" data-cat="orthographe">✍️ Orthographe</button>
          <button type="button" class="atelier-cat-btn" data-cat="vocabulaire">📚 Vocabulaire</button>
          <button type="button" class="atelier-cat-btn" data-cat="expression">📝 Expression</button>
        </div>
        <div class="atelier-difficulty-selector">
          <button type="button" class="atelier-diff-btn active" data-diff="easy">🟢 Débutant</button>
          <button type="button" class="atelier-diff-btn" data-diff="medium">🟡 Intermédiaire</button>
          <button type="button" class="atelier-diff-btn" data-diff="hard">🔴 Avancé</button>
        </div>
      </div>

      <div class="atelier-game-zone" id="atelierGameZone">
        <div class="atelier-question-category-tag" id="atelierQCatTag">Général</div>
        <div class="atelier-question-text" id="atelierQuestionText">Clique sur "Lancer le quiz" pour commencer !</div>
        <div id="atelierInteractiveArea" style="width: 100%;">
          <p style="color: #64748b; font-size: 0.85rem;">Prépare-toi à relever les défis de la langue française.</p>
        </div>
        <div class="atelier-feedback" id="atelierFeedback"></div>
      </div>

      <div class="atelier-timer-bar-container">
        <div class="atelier-timer-bar" id="atelierTimerBar"></div>
      </div>

      <button type="button" class="atelier-btn-start" id="atelierBtnStart">Lancer le quiz</button>

      <div class="atelier-score-board">
        <span id="atelierQuestionCounter">Question : 0/0</span>
        <span id="atelierScoreDisplay">Score : 0</span>
      </div>

      <!-- Modal Paramètres -->
      <div class="atelier-modal-overlay" id="atelierSettingsModal">
        <div class="atelier-modal-header">
          <h2>⚙️ Réglages du Jeu</h2>
          <button type="button" class="atelier-close-btn" id="atelierBtnCloseSettings">✕</button>
        </div>
        <div class="atelier-config-grid">
          <div class="atelier-config-group">
            <label>Nombre de questions par série :</label>
            <select id="atelierSeriesLengthSelect">
              <option value="5" selected>5 questions</option>
              <option value="10">10 questions</option>
              <option value="15">15 questions</option>
            </select>
          </div>
          <div class="atelier-config-group">
            <label>Temps par question :</label>
            <select id="atelierTimeLimitSelect">
              <option value="10">10 secondes</option>
              <option value="15" selected>15 secondes</option>
              <option value="25">25 secondes</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Modal Bilan -->
      <div class="atelier-summary-overlay" id="atelierSummaryModal">
        <h2 class="atelier-summary-title">📊 Bilan de l'Aventure</h2>

        <div class="atelier-dancer-container" id="atelierDancerContainer">
          <div class="atelier-dancer"><div class="atelier-dancer-smile"></div></div>
        </div>

        <div class="atelier-success-badge" id="atelierSuccessBadge">100%</div>
        <div id="atelierSummaryMessage" class="atelier-summary-message"></div>

        <div id="atelierErrorSection" class="atelier-error-section" style="display: none; flex: 1; overflow-y: auto;">
          <h4 class="atelier-error-title">Points à revoir :</h4>
          <table class="atelier-error-table">
            <thead>
              <tr>
                <th>Question</th>
                <th>Ta réponse</th>
                <th>Bonne réponse</th>
              </tr>
            </thead>
            <tbody id="atelierErrorTableBody"></tbody>
          </table>
        </div>

        <button type="button" class="atelier-btn-start" id="atelierBtnRejouer" style="margin-top:8px;">Rejouer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-utilisateur.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/navigation-config.js"></script>
  <script src="../../js/banniere-site.js"></script>
  <script src="../../js/entete-navigation.js"></script>
  <script src="../../js/theme-premium-eleve.js"></script>
  <script src="../../js/pages/eleve-jeu-atelier-francais.js"></script>
</body>
</html>
