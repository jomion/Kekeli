<style>
  /* Page "Mon profil" (19 septembre 2026) : fiche de lecture SEULE, aucun
     champ modifiable — voir js/pages/eleve-profil.js. Classes propres à
     cette page (non retouchées par le thème premium, même principe que
     .grille-totaux-badges-paliers sur pages/eleve/badges.html). */
  .profil-carte-identite { background: white; border-radius: 14px; padding: 28px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.10), 0 0 0 1px rgba(15,23,42,0.07); margin-bottom: 24px; }
  .profil-avatar-grand { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .profil-carte-identite h1 { margin: 0 0 4px; font-size: 22px; color: var(--noir-kekeli); }
  .profil-classe { margin: 0; color: var(--text-gris); font-size: 14px; }
  .grille-totaux-profil { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .carte-total-profil { background: white; border-radius: 12px; padding: 16px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 26px; }
  .carte-total-profil .valeur-total-profil { font-size: 22px; font-weight: 800; color: var(--bleu-kekeli); margin: 4px 0 2px; }
  .carte-total-profil div:last-child { font-size: 12px; color: var(--text-gris); font-weight: 600; }
</style>
