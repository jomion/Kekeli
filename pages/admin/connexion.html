<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI Admin - Connexion</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #003366 0%, #001A33 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .carte-login { background: white; padding: 36px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); width: 100%; max-width: 360px; border-top: 6px solid #FFCC00; }
  .logo { text-align: center; font-size: 24px; font-weight: 800; color: #003366; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .logo img { height: 36px; width: auto; }
  .sous-titre { text-align: center; font-size: 13px; color: #64748B; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  input { width: 100%; padding: 11px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #003366; }
  button { width: 100%; padding: 13px; background: #FFCC00; color: #003366; border: none; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .erreur { color: #c0392b; font-size: 13px; margin-bottom: 10px; text-align: center; }
</style>
</head>
<body>
  <div class="carte-login">
    <div class="logo"><img src="../../assets/logo/logo.png" alt="KEKELI"> KEKELI</div>
    <div class="sous-titre">Espace administration</div>
    <form id="formLogin">
      <label>E-mail</label>
      <input type="email" id="email" required>
      <label>Mot de passe</label>
      <input type="password" id="motDePasse" required>
      <p class="erreur" id="erreur"></p>
      <button type="submit" id="btn">Se connecter</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-admin.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreur = document.getElementById('erreur');
      const btn = document.getElementById('btn');
      erreur.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connexion...';

      const { error, profil } = await seConnecterAdmin(
        document.getElementById('email').value.trim(),
        document.getElementById('motDePasse').value
      );

      if (error) {
        erreur.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Se connecter';
        return;
      }
      window.location.href = 'tableau-de-bord.html';
    });
  </script>
</body>
</html>
