<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI Admin - Questions IA (jeux)</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .filtres-qia { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filtres-qia select { padding: 9px; border-radius: 8px; border: 1px solid var(--bordure); }
  .barre-actions-qia { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .groupe-qia { margin-bottom: 22px; }
  .groupe-qia h3 { font-size: 14px; color: var(--bleu-principal); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .03em; }
  .carte-question-qia { background: white; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-left: 4px solid var(--bleu-principal); margin-bottom: 8px; }
  .carte-question-qia.archivee { opacity: .55; border-left-color: #9ca3af; }
  .carte-question-qia .entete-question-qia { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .carte-question-qia p { margin: 4px 0 0; font-size: 13px; }
  .carte-question-qia .bonne-reponse-qia { color: #059669; font-weight: 600; }
  .pastille-qia { display: inline-block; background: var(--bleu-clair); color: var(--bleu-principal); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; margin-right: 6px; }
  .actions-question-qia { display: flex; gap: 6px; flex-shrink: 0; }
  .actions-question-qia button { padding: 4px 10px; font-size: 11px; }
  .carte-proposition-qia { border: 1px solid var(--bordure); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .carte-proposition-qia.exclue { opacity: .5; }
  .carte-proposition-qia label.entete-proposition-qia { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
</style>
<link rel="stylesheet" href="../../css/pied-de-page.css">
</head>
<body>
  <header></header>

  <div class="conteneur">
    <div class="titre-page">🤖 Questions IA pour les jeux (Français / ES / EST)</div>
    <div class="sous-titre-page">Génération de questions inédites par IA pour les jeux d'entraînement, à partir de séances réellement publiées de la classe visée — jamais accessibles à un élève tant qu'elles ne sont pas relues et validées ici.</div>
    <div id="contenu" class="chargement">Chargement...</div>
  </div>

  <script src="../../js/navigation-config.js"></script>
  <script src="../../js/banniere-site.js"></script>
  <script src="../../js/entete-navigation.js"></script>
  <script src="../../js/editeur/blocs.js"></script>
  <script src="../../js/jeux/rendu-questions-jeu.js"></script>
  <script src="../../js/pages/admin-questions-ia-jeux.js"></script>
  <footer></footer>
  <script src="../../js/pied-de-page.js"></script>
</body>
