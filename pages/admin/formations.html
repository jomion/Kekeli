<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI Admin - Plateforme de formation</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">

<style>
  .af-onglets { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0; border-bottom:1px solid #e2e8f0; }
  .af-onglets button { background:none; border:0; border-bottom:3px solid transparent; padding:10px 14px; font-weight:700; color:#64748b; cursor:pointer; }
  .af-onglets button.actif { color:#0b7a5c; border-bottom-color:#0b7a5c; }
  .af-table-wrap { overflow-x:auto; }
  .af-table { width:100%; border-collapse:collapse; font-size:14px; background:#fff; }
  .af-table th, .af-table td { text-align:left; padding:10px; border-bottom:1px solid #e2e8f0; vertical-align:top; }
  .af-table th { font-size:12px; text-transform:uppercase; color:#64748b; }
  .af-pastille { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#eef2f0; }
  .af-pastille.en_revision, .af-pastille.en_attente { background:#fff6d6; color:#6b5200; }
  .af-pastille.publiee, .af-pastille.valide, .af-pastille.actif, .af-pastille.terminee { background:#dff2eb; color:#07553f; }
  .af-pastille.refusee, .af-pastille.refuse, .af-pastille.suspendu, .af-pastille.inactif { background:#fdecea; color:#c0392b; }
  .af-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:12px 0; }
  .af-stat { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; }
  .af-stat small { color:#64748b; font-weight:700; font-size:12px; text-transform:uppercase; }
  .af-stat strong { display:block; font-size:24px; }
  .af-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .af-actions .btn { padding:6px 10px; font-size:13px; }
</style>
</head>
<body>
  <header></header>

  <div class="conteneur">

  </div>

  <footer></footer>

</body>
