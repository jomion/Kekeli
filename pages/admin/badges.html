<title>KEKELI Admin - Badges des élèves</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo.png">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .grille-badges-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 18px 0 26px; }
  .carte-badge-admin { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-left: 4px solid var(--bleu-principal); text-align: center; }
  .carte-badge-admin .icone-badge-admin { font-size: 30px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
  .carte-badge-admin h4 { margin: 8px 0 4px; font-size: 15px; }
  .carte-badge-admin .regle-badge-admin { margin: 0 0 8px; font-size: 12.5px; color: var(--texte-gris); text-align: left; }
  .carte-badge-admin .conditions-badge-admin { margin: 0; padding-left: 18px; font-size: 12px; color: var(--texte-gris); text-align: left; }
  .carte-badge-admin .conditions-badge-admin li { margin-bottom: 3px; }
  .grille-medailles-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .carte-medaille-admin { background: white; border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
</style>
<link rel="stylesheet" href="../../css/pied-de-page.css">
</head>

    <div id="contenu" class="chargement">Chargement...</div>
  </div>
