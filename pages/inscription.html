<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Créer un compte</title>
<link rel="stylesheet" href="../css/style-public.css">
</head>
<body>
  <div class="page-auth">
    <div class="carte-auth">
      <div class="logo"><img src="../assets/logo/logo.png" alt="KEKELI"> KEKELI</div>
      <div class="sous-titre">Créez votre compte</div>

      <form id="formInscription">
        <div class="champ-auth">
          <label>Type de compte</label>
          <select id="role" required>
            <option value="parent">👨‍👩‍👧 Parent</option>
            <option value="enseignant">🧑‍🏫 Enseignant</option>
          </select>
          <p id="noteRole" style="font-size:12px;color:var(--text-gris);margin:6px 0 0"></p>
        </div>
        <div class="champ-auth">
          <label>Prénom</label>
          <input type="text" id="prenom" required>
        </div>
        <div class="champ-auth">
          <label>Nom</label>
          <input type="text" id="nom" required>
        </div>
        <div class="champ-auth">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="nom@exemple.com" required>
        </div>
        <div class="champ-auth">
          <label>Mot de passe</label>
          <input type="password" id="motDePasse" minlength="6" placeholder="•••••••• (6 caractères min.)" required>
        </div>
        <p class="message-erreur-auth" id="messageErreur"></p>
        <button type="submit" class="btn-auth-principal" id="btnInscription">Créer mon compte</button>
      </form>

      <div class="lien-auth-secondaire">
        Vous avez déjà un compte ? <a href="login.html">Se connecter</a><br>
        <a href="../index.html">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../";</script>
  <script src="../js/auth-utilisateur.js"></script>
  <script>
    const noteRole = document.getElementById('noteRole');
    function majNote() {
      noteRole.textContent = document.getElementById('role').value === 'parent'
        ? "Vous pourrez ensuite inscrire votre (vos) enfant(s) depuis votre espace."
        : "";
    }
    document.getElementById('role').addEventListener('change', majNote);
    majNote();

    document.getElementById('formInscription').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageErreur = document.getElementById('messageErreur');
      const btn = document.getElementById('btnInscription');
      messageErreur.textContent = '';
      btn.disabled = true; btn.textContent = 'Création en cours...';

      const role = document.getElementById('role').value;
      const { error } = await inscrire({
        role,
        prenom: document.getElementById('prenom').value.trim(),
        nom: document.getElementById('nom').value.trim(),
        email: document.getElementById('email').value.trim(),
        motDePasse: document.getElementById('motDePasse').value
      });

      if (error) {
        messageErreur.textContent = error.message || "Impossible de créer le compte. Vérifiez vos informations.";
        btn.disabled = false; btn.textContent = 'Créer mon compte';
        return;
      }
      window.location.href = urlTableauDeBord(role);
    });
  </script>
</body>
</html>
