<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Créer un compte</title>
<link rel="stylesheet" href="../css/style-public.css">
</head>
<body>
  <div class="page-auth">
    <div class="carte-auth carte-auth-large">
      <div class="logo"><img src="../assets/logo/logo.png" alt="KEKELI"> KEKELI</div>
      <div class="sous-titre">Créez votre compte</div>

      <form id="formInscription">
        <div class="champ-auth">
          <label>Type de compte</label>
          <select id="role" required>
            <option value="parent">👨‍👩‍👧 Parent</option>
            <option value="enseignant">🧑‍🏫 Enseignant</option>
            <option value="autorite_pedagogique">🏛️ Autorité Pédagogique</option>
          </select>
          <p id="noteRole" style="font-size:12px;color:var(--text-gris);margin:6px 0 0"></p>
        </div>

        <div class="champ-auth" id="champFonction" style="display:none">
          <label>Fonction</label>
          <select id="fonction">
            <option value="directeur">Directeur</option>
            <option value="conseiller_pedagogique">Conseiller Pédagogique</option>
            <option value="inspecteur">Inspecteur</option>
            <option value="directeur_departemental">Directeur Départemental</option>
          </select>
        </div>

        <div class="rangee-champs-auth">
          <div class="champ-auth">
            <label>Prénom</label>
            <input type="text" id="prenom" required>
          </div>
          <div class="champ-auth">
            <label>Nom</label>
            <input type="text" id="nom" required>
          </div>
        </div>

        <div class="rangee-champs-auth">
          <div class="champ-auth">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="nom@exemple.com" required>
          </div>
          <div class="champ-auth">
            <label>Sexe</label>
            <select id="sexe" required>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>
        </div>

        <div class="rangee-champs-auth">
          <div class="champ-auth">
            <label>Mot de passe</label>
            <input type="password" id="motDePasse" minlength="6" placeholder="•••••••• (6 caractères min.)" required>
          </div>
          <div class="champ-auth">
            <label>Confirmer le mot de passe</label>
            <input type="password" id="motDePasseConfirmation" minlength="6" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Localisation : les champs affichés dépendent du rôle (et, pour
             l'Autorité Pédagogique, de la fonction) — voir majChampsLocalisation()
             plus bas. Département, Commune, Arrondissement et Circonscription
             Scolaire sont des listes déroulantes en cascade (js/geo-benin.js).
             Regroupés par deux (rangee-champs-auth) pour une saisie moins
             verticale — chaque bloc peut être masqué indépendamment par
             majChampsLocalisation() sans casser la mise en page de l'autre. -->
        <div class="rangee-champs-auth">
          <div class="champ-auth" id="champDepartement">
            <label>Département</label>
            <select id="departement"></select>
          </div>
          <div class="champ-auth" id="champCommune">
            <label>Commune</label>
            <select id="commune"></select>
          </div>
        </div>
        <div class="rangee-champs-auth">
          <div class="champ-auth" id="champArrondissement">
            <label>Arrondissement</label>
            <select id="arrondissement"></select>
          </div>
          <div class="champ-auth" id="champCirconscription">
            <label>Circonscription Scolaire</label>
            <select id="circonscriptionScolaire"></select>
          </div>
        </div>
        <div class="rangee-champs-auth">
          <div class="champ-auth" id="champZone">
            <label>Zone Pédagogique</label>
            <select id="zonePedagogique"></select>
          </div>
          <div class="champ-auth" id="champEcole">
            <label>École</label>
            <input type="text" id="ecole">
          </div>
        </div>
        <div class="champ-auth" id="champClasse" style="display:none">
          <label>Classe</label>
          <select id="classe"></select>
          <p style="font-size:12px;color:var(--text-gris);margin:6px 0 0">Cette classe vous sera attribuée directement. Pour une classe supplémentaire, vous pourrez ensuite en faire la demande depuis votre espace (validée par l'administration).</p>
        </div>

        <p class="message-erreur-auth" id="messageErreur"></p>
        <button type="submit" class="btn-auth-principal" id="btnInscription">Créer mon compte</button>
      </form>

      <div class="lien-auth-secondaire">
        Vous avez déjà un compte ? <a href="login.html">Se connecter</a><br>
        <a href="../index.html">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../";</script>
  <script src="../js/auth-utilisateur.js"></script>
  <script src="../js/geo-benin.js"></script>
  <script>
    const selectRole = document.getElementById('role');
    const selectFonction = document.getElementById('fonction');
    const noteRole = document.getElementById('noteRole');

    const champFonction = document.getElementById('champFonction');
    const champDepartement = document.getElementById('champDepartement');
    const champCommune = document.getElementById('champCommune');
    const champArrondissement = document.getElementById('champArrondissement');
    const champCirconscription = document.getElementById('champCirconscription');
    const champZone = document.getElementById('champZone');
    const champEcole = document.getElementById('champEcole');
    const champClasse = document.getElementById('champClasse');

    initialiserCascadeGeoBenin(document.getElementById('departement'), document.getElementById('commune'), document.getElementById('arrondissement'), document.getElementById('circonscriptionScolaire'));
    document.getElementById('zonePedagogique').innerHTML = ZONES_PEDAGOGIQUES.map(z => `<option value="${z}">${z}</option>`).join('');

    // Liste des classes, pour que l'enseignant en choisisse une à l'inscription
    // (elle lui est attribuée directement — voir majChampsLocalisation ci-dessous).
    (async function chargerClasses() {
      // Une classe masquée par l'admin (mise à jour en cours) n'est pas
      // proposée pour une nouvelle inscription — sans être supprimée pour
      // autant, elle réapparaîtra dès qu'elle sera démasquée.
      const { data: classes } = await supabaseClient.from('classes').select('*').eq('visible', true).order('ordre');
      document.getElementById('classe').innerHTML = (classes || []).map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
    })();

    // Pour chaque rôle/fonction, quels champs de localisation afficher.
    // (Les champs habituels — nom, prénom, e-mail, mot de passe — sont
    // toujours visibles, en dehors de cette logique.)
    function majChampsLocalisation() {
      const role = selectRole.value;
      const fonction = selectFonction.value;
      const estAutorite = role === 'autorite_pedagogique';
      const estEnseignant = role === 'enseignant';

      champFonction.style.display = estAutorite ? '' : 'none';

      // Département : toujours demandé, quel que soit le rôle.
      champDepartement.style.display = '';

      if (estEnseignant) {
        // Enseignant : Département, Commune, Arrondissement, Circonscription
        // Scolaire, Zone Pédagogique, École, Classe (attribuée directement).
        champCommune.style.display = '';
        champArrondissement.style.display = '';
        champCirconscription.style.display = '';
        champZone.style.display = '';
        champEcole.style.display = '';
        champClasse.style.display = '';
        return;
      }
      champClasse.style.display = 'none';

      if (!estAutorite) {
        // Parent : Département, Commune, Arrondissement.
        champCommune.style.display = '';
        champArrondissement.style.display = '';
        champCirconscription.style.display = 'none';
        champZone.style.display = 'none';
        champEcole.style.display = 'none';
        return;
      }

      // Autorité Pédagogique : dépend de la fonction choisie. Arrondissement
      // est exigé pour les fonctions situées dans la structure école
      // (Directeur, Conseiller Pédagogique, Inspecteur) — pas pour le
      // Directeur Départemental (voir FONCTIONS_AUTORITE_PEDAGOGIQUE dans
      // js/auth-utilisateur.js, dont cette liste est le miroir côté affichage).
      const parFonction = FONCTIONS_AUTORITE_PEDAGOGIQUE[fonction] || {};

      champCommune.style.display = parFonction.commune ? '' : 'none';
      champArrondissement.style.display = parFonction.arrondissement ? '' : 'none';
      champCirconscription.style.display = parFonction.circonscriptionScolaire ? '' : 'none';
      champZone.style.display = parFonction.zonePedagogique ? '' : 'none';
      champEcole.style.display = parFonction.ecole ? '' : 'none';
    }

    function majNote() {
      noteRole.textContent = selectRole.value === 'parent'
        ? "Vous pourrez ensuite inscrire votre (vos) enfant(s) depuis votre espace."
        : "";
    }
    selectRole.addEventListener('change', () => { majNote(); majChampsLocalisation(); });
    selectFonction.addEventListener('change', majChampsLocalisation);
    majNote();
    majChampsLocalisation();

    document.getElementById('formInscription').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageErreur = document.getElementById('messageErreur');
      const btn = document.getElementById('btnInscription');
      messageErreur.textContent = '';

      const motDePasse = document.getElementById('motDePasse').value;
      const motDePasseConfirmation = document.getElementById('motDePasseConfirmation').value;
      if (motDePasse !== motDePasseConfirmation) {
        messageErreur.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }

      btn.disabled = true; btn.textContent = 'Création en cours...';

      const role = selectRole.value;
      const { error, avertissement } = await inscrire({
        role,
        fonction: role === 'autorite_pedagogique' ? selectFonction.value : undefined,
        prenom: document.getElementById('prenom').value.trim(),
        nom: document.getElementById('nom').value.trim(),
        email: document.getElementById('email').value.trim(),
        sexe: document.getElementById('sexe').value,
        motDePasse,
        departement: document.getElementById('departement').value,
        commune: document.getElementById('commune').value,
        arrondissement: document.getElementById('arrondissement').value.trim(),
        circonscriptionScolaire: document.getElementById('circonscriptionScolaire').value.trim(),
        zonePedagogique: document.getElementById('zonePedagogique').value,
        ecole: document.getElementById('ecole').value.trim(),
        classeId: role === 'enseignant' ? document.getElementById('classe').value : undefined
      });

      if (error) {
        messageErreur.textContent = error.message || "Impossible de créer le compte. Vérifiez vos informations.";
        btn.disabled = false; btn.textContent = 'Créer mon compte';
        return;
      }
      if (avertissement) {
        alert("Votre compte a été créé, mais la classe n'a pas pu être attribuée automatiquement (" + avertissement + "). Vous pourrez en faire la demande depuis votre espace.");
      }
      window.location.href = urlTableauDeBord(role);
    });
  </script>
</body>
</html>
