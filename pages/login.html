<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Connexion</title>
<link rel="stylesheet" href="../css/style-public.css">
</head>
<body>
  <div class="page-auth">
    <div class="carte-auth">
      <div class="logo"><img src="../assets/logo/logo.png" alt="KEKELI"> KEKELI</div>
      <div class="sous-titre">Connectez-vous à votre espace</div>
      <p class="bandeau-succes" id="bandeauSucces" style="display:none">✅ Compte enfant créé — reconnectez-vous à votre espace parent pour continuer.</p>

      <form id="formLogin">
        <div class="champ-auth">
          <label>Je suis :</label>
          <select id="role" required>
            <option value="eleve">🎓 Élève</option>
            <option value="parent">👨‍👩‍👧 Parent</option>
            <option value="enseignant">🧑‍🏫 Enseignant</option>
            <option value="autorite_pedagogique">🏛️ Autorité Pédagogique</option>
          </select>
        </div>
        <div class="champ-auth">
          <label>Identifiant ou e-mail</label>
          <input type="text" id="identifiant" placeholder="Ex: nom@exemple.com" required>
        </div>
        <div class="champ-auth">
          <label>Mot de passe</label>
          <input type="password" id="motDePasse" placeholder="••••••••" required>
        </div>
        <p class="message-erreur-auth" id="messageErreur"></p>
        <button type="submit" class="btn-auth-principal" id="btnLogin">Se connecter</button>
      </form>

      <div class="lien-auth-secondaire">
        Pas encore de compte ? <a href="inscription.html">S'inscrire</a><br>
        <a href="../index.html">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../";</script>
  <script src="../js/auth-utilisateur.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).get('enfant_cree') === '1') {
      document.getElementById('bandeauSucces').style.display = 'block';
      document.getElementById('role').value = 'parent';
    }
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const roleAttendu = document.getElementById('role').value;
      const messageErreur = document.getElementById('messageErreur');
      const btn = document.getElementById('btnLogin');
      messageErreur.textContent = '';
      btn.disabled = true; btn.textContent = 'Connexion...';

      const { error, profil } = await seConnecter(
        document.getElementById('identifiant').value.trim(),
        document.getElementById('motDePasse').value
      );

      if (error) {
        messageErreur.textContent = error.message;
        btn.disabled = false; btn.textContent = 'Se connecter';
        return;
      }
      if (profil.role !== roleAttendu) {
        messageErreur.textContent = `Ce compte est enregistré comme "${profil.role}", pas "${roleAttendu}". Vérifiez votre sélection.`;
        await supabaseClient.auth.signOut();
        btn.disabled = false; btn.textContent = 'Se connecter';
        return;
      }
      window.location.href = urlTableauDeBord(profil.role);
    });
  </script>
</body>
</html>
