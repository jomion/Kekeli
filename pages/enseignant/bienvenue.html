<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Bienvenue</title>
<link rel="stylesheet" href="../../css/style-public.css">
<style>
  .welcome-container-eleve { max-width: 900px; margin: 30px auto; padding: 0 20px; text-align: center; }
  .welcome-card-eleve { background: white; border-radius: 16px; padding: 36px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid var(--bleu-kekeli); margin-bottom: 28px; }
  .mascot-avatar-eleve { font-size: 56px; background: #EBF5FB; width: 92px; height: 92px; line-height: 92px; border-radius: 50%; margin: 0 auto 14px; border: 3px solid var(--bleu-kekeli); }
  .section-title-eleve { text-align: left; font-size: 19px; color: var(--bleu-kekeli); margin-bottom: 18px; }
  .actions-grid-eleve { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
  .action-card-eleve { background: white; border-radius: 12px; padding: 22px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 2px solid transparent; transition: all .2s; text-decoration: none; color: inherit; display: block; }
  .action-card-eleve:hover { border-color: var(--bleu-kekeli); transform: translateY(-3px); }
  .action-icon-eleve { font-size: 28px; margin-bottom: 10px; }
  .action-title-eleve { font-size: 17px; font-weight: bold; color: var(--bleu-kekeli); margin-bottom: 5px; }
  .action-desc-eleve { font-size: 13px; color: var(--text-gris); line-height: 1.4; }
  .btn-start-eleve { display: block; width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <header class="entete-tableau-bord">
    <a href="../../index.html" class="logo"><img src="../../assets/logo/logo.png" alt="KEKELI"> KEKELI</a>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="zoneCloche"></div>
      <span class="badge-utilisateur-public" id="badgeUtilisateur">Connexion...</span>
      <button class="btn-deconnexion-public" onclick="deconnecterUtilisateur()">Déconnexion</button>
    </div>
  </header>

  <div class="welcome-container-eleve" id="contenu">
    <p style="text-align:center;color:var(--text-gris)">Chargement...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-utilisateur.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/pages/enseignant-bienvenue.js"></script>
</body>
</html>
