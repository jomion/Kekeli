<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Changer mon mot de passe</title>
<link rel="icon" type="image/png" href="../assets/logo/logo.png">
<link rel="stylesheet" href="../css/style-public.css">
</head>
<body class="page-sans-fond-ciel">
  <div class="page-auth">
    <div class="carte-auth">
      <div class="logo"><img src="../assets/logo/logo.png" alt="KEKELI"> KEKELI</div>
      <div class="sous-titre">Choisissez votre mot de passe</div>

      <div id="zoneChargement" style="text-align:center;color:var(--text-gris);font-size:14px">Chargement...</div>

      <div id="zoneFormulaire" style="display:none">
        <p style="font-size:13px;color:var(--text-gris);text-align:center;margin:-8px 0 20px">
          Pour des raisons de sécurité, vous devez choisir votre propre mot de passe avant de continuer.
        </p>

        <form id="formChangerMotDePasse">
          <div class="champ-auth">
            <label>Nouveau mot de passe</label>
            <input type="password" id="nouveauMotDePasse" placeholder="6 caractères min." required>
          </div>
          <div class="champ-auth">
            <label>Confirmer le mot de passe</label>
            <input type="password" id="confirmationMotDePasse" placeholder="••••••••" required>
          </div>
          <p class="message-erreur-auth" id="messageErreur"></p>
          <button type="submit" class="btn-auth-principal" id="btnValider">Choisir ce mot de passe</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../";</script>
  <script src="../js/auth-utilisateur.js"></script>
  <script src="../js/pages/changer-mot-de-passe-oblige.js"></script>
</body>
</html>
