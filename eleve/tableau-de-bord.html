<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKELI - Mon espace</title>
<link rel="stylesheet" href="../../css/style-public.css">
<style>
  .carte-bienvenue-eleve { text-align: center; }
  .mascotte-eleve { font-size: 56px; background: #E6FBFF; width: 96px; height: 96px; line-height: 96px; border-radius: 50%; margin: 0 auto 14px; border: 3px solid var(--accent-cyan); }
  .profile-card-eleve { background: white; border-left: 6px solid var(--bleu-kekeli); padding: 1.4rem 1.6rem; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 1.6rem; }
  .progress-bar-bg-eleve { background: #E2E8F0; height: 12px; border-radius: 6px; overflow: hidden; margin-top: .5rem; }
  .progress-bar-fill-eleve { background: linear-gradient(90deg, var(--bleu-kekeli), var(--accent-cyan)); height: 100%; border-radius: 6px; }
  .dashboard-grid-eleve { display: grid; grid-template-columns: 2fr 1fr; gap: 1.4rem; }
  @media (max-width: 900px) { .dashboard-grid-eleve { grid-template-columns: 1fr; } }
  .grille-paliers-tb { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.6rem; }
  .palier-card-tb { background: white; padding: 1.2rem; border-radius: 12px; text-align: center; border-top: 5px solid; box-shadow: 0 1px 4px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: block; }
  .palier-card-tb.courant { box-shadow: 0 0 0 3px rgba(0,0,209,0.15); }
  .widget-eleve { background: white; padding: 1.2rem 1.4rem; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 1.2rem; }
  .stat-item-eleve { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px solid var(--bordure); font-size: 14px; }
  .stat-item-eleve:last-child { border-bottom: none; }
</style>
</head>
<body>
  <header class="entete-tableau-bord">
    <a href="../../index.html" class="logo"><img src="../../assets/logo/logo.png" alt="KEKELI"> KEKELI</a>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="zoneCloche"></div>
      <span class="badge-utilisateur-public" id="badgeUtilisateur">Connexion...</span>
      <button class="btn-deconnexion-public" onclick="deconnecterUtilisateur()">Déconnexion</button>
    </div>
  </header>

  <div class="conteneur-tableau-bord" id="contenu">
    <p style="text-align:center;color:var(--text-gris)">Chargement...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-utilisateur.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/pages/eleve-tableau-de-bord.js"></script>
</body>
</html>
